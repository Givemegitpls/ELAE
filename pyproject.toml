[project]
name = "sai-lineart"
version = "0.1.0"
description = "Minimal SAI-like vector lineart editor"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7"]

[project.scripts]
sai-lineart = "sai.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.basedpyright]
include = ["sai", "tests"]
